<title>Katakyie Academic Advisor</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Katakyie Academic Advisor — a single committed dark identity: warm black grounds, gold used sparingly. */
:root{
  color-scheme:dark;
  --bg:#0A0908; --panel:#121110; --panel2:#1B1917; --panel3:#232019;
  --line:#272420; --line2:#3A352C;
  --text:#F3EEE4; --muted:#A79F90; --faint:#7B7466;
  --brand:#D9B441; --brand-2:#EBC95F; --brand-soft:#241D0E; --brand-line:#4A3C18; --on-brand:#120E04;
  --accent:#C4864A; --accent-soft:#2A1C10;
  --ok:#6FC395; --ok-soft:#10241B; --warn:#E08D3F; --warn-soft:#2B1C0C; --crit:#E0705D; --crit-soft:#2D1512;
  --shadow:0 1px 2px rgba(0,0,0,.6), 0 10px 30px -20px rgba(0,0,0,.95);
  --shadow-lift:0 2px 8px rgba(0,0,0,.7), 0 26px 50px -28px #000;
  --r:11px; --r-sm:8px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

/* ---------- primitives ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.serif{font-family:var(--serif)}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line2);
  background:var(--panel2);color:var(--text);font-weight:500;font-size:13px;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel3);border-color:var(--brand-line)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.btn.pri:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 9px}
.btn.ghost:hover{background:var(--panel2);color:var(--text)}
.btn.danger{color:var(--crit);border-color:var(--line2)}
.btn.danger:hover{background:var(--crit-soft);border-color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--panel2);color:var(--text)}
.inp::placeholder{color:var(--faint)}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.55}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 10px) calc(50% + 1px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--panel3);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14.5px}
.card-b{padding:18px}
.card-b.flush{padding:0}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;grid-template-columns:1.05fr .95fr;background:var(--bg)}
#login .brandside{background:
   radial-gradient(1100px 500px at 12% -10%, rgba(217,180,65,.10), transparent 60%),
   linear-gradient(170deg,#141109,#0A0908 60%);
  color:var(--text);padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;border-right:1px solid var(--brand-line)}
#login .brandside h1{font-family:var(--serif);font-size:clamp(28px,3.6vw,42px);line-height:1.08;font-weight:600;letter-spacing:-.012em}
#login .brandside p{color:var(--muted);max-width:46ch;margin-top:14px;font-size:15px}
#login .marks{display:flex;flex-wrap:wrap;gap:9px}
#login .marks span{border:1px solid var(--brand-line);border-radius:999px;padding:4px 12px;font-size:11.5px;color:var(--muted)}
#login .formside{display:flex;align-items:center;justify-content:center;padding:40px 24px}
#login .formwrap{width:100%;max-width:360px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px;margin-bottom:20px}
.seg button{flex:1;padding:7px 10px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.logomark{width:34px;height:34px;flex:none}

/* ---------- shell ---------- */
#shell{display:none;min-height:100%}
#shell.on{display:grid;grid-template-columns:248px minmax(0,1fr)}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh}
.side-h{padding:18px 16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.side-h .nm{font-family:var(--serif);font-size:16.5px;font-weight:600;line-height:1.15;letter-spacing:-.005em}
.side-h .sub{font-family:var(--mono);font-size:9.5px;color:var(--brand);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.nav{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--muted);font-weight:500;font-size:13.5px;cursor:pointer}
.nav a:hover{background:var(--panel2);color:var(--text);text-decoration:none}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600;box-shadow:inset 0 0 0 1px var(--brand-line)}
.nav a svg{flex:none;opacity:.9}
.side-f{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line);
  display:grid;place-items:center;font-weight:700;font-size:11.5px;flex:none}

.main{min-width:0;max-width:100%;display:flex;flex-direction:column;overflow:hidden}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-height:50px}
.topbar .crumb{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.wrap{padding:24px 26px 72px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.wrap>*{min-width:0;max-width:100%}
.card,.kpi{min-width:0}
.grid2>*,.grid3>*,.kpis>*{min-width:0}

/* ---------- ticker ---------- */
.ticker{position:relative;background:linear-gradient(90deg,#171309,#0E0C07);
  border-bottom:1px solid var(--brand-line);display:flex;align-items:stretch;min-height:36px;overflow:hidden}
.ticker .tag{flex:none;background:var(--brand);color:var(--on-brand);font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;padding:0 12px;align-self:stretch;display:flex;align-items:center;z-index:2;
  border:0;cursor:pointer}
.ticker .tag:hover{background:var(--brand-2)}
.ticker .rest{display:flex;align-items:center;height:100%;padding:0 16px;font-size:12.5px;color:var(--muted)}
.tickwin{flex:1;min-width:0;overflow:hidden}
.ticker .track{display:flex;white-space:nowrap;will-change:transform;animation:tick 64s linear infinite}
.ticker:hover .track,.ticker:focus-within .track{animation-play-state:paused}
.ticker .it{display:inline-flex;align-items:center;gap:8px;flex:none;padding:0 20px;font-size:12.5px;color:var(--muted);
  border:0;border-right:1px solid var(--line);background:transparent;font-family:inherit;text-align:left;cursor:pointer;height:100%}
.ticker .it:hover{background:rgba(217,180,65,.07);text-decoration:none}
.ticker .it:hover b{color:var(--brand)}
.ticker .it b{color:var(--text);font-weight:600}
.ticker .it .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.ticker .it.hot .k{color:var(--warn)}
.ticker .it.late .k{color:var(--crit)}
.ticker a{color:inherit}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .track{animation:none}.tickwin{overflow-x:auto}}

/* ---------- portal header ---------- */
.portalhead{border:1px solid var(--line);border-radius:var(--r);background:
  radial-gradient(900px 300px at 0% -40%, rgba(217,180,65,.07), transparent 60%), var(--panel);
  padding:22px 24px;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.portalhead .ph-main{flex:1 1 320px;min-width:0}
.portalhead h1{font-family:var(--serif);font-size:clamp(23px,2.6vw,30px);line-height:1.12;letter-spacing:-.015em;margin-top:7px}
.portalhead .ph-lede{color:var(--muted);font-size:13.5px;margin-top:8px;max-width:66ch}
.portalhead .ph-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.portalhead .ph-stats{width:100%;display:flex;gap:26px;flex-wrap:wrap;padding-top:18px;margin-top:4px;border-top:1px solid var(--line)}
.portalhead .ph-stats div b{display:block;font-family:var(--serif);font-size:23px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.portalhead .ph-stats div span{display:block;font-size:11.5px;color:var(--faint);margin-top:5px}
.portalhead .ph-stats div.flag b{color:var(--crit)}

/* ---------- tab bar (sub-navigation) ---------- */
.tabbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabbar button{padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);
  font-weight:500;font-size:12.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tabbar button:hover{color:var(--text);border-color:var(--brand-line)}
.tabbar button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}

/* ---------- pieces ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi.flag .v{color:var(--crit)}

.bar{height:6px;border-radius:999px;background:var(--panel3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--brand);transition:width .3s ease}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:500;
  padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr.clickable{cursor:pointer}
table.tbl tbody tr.clickable:hover{background:var(--panel2)}
.scrollx{overflow-x:auto}

.stepper{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:106px;padding:0 4px}
.step .rail{height:4px;border-radius:999px;background:var(--panel3);margin-bottom:9px;overflow:hidden}
.step .rail i{display:block;height:100%;background:var(--brand)}
.step.done .rail i{background:var(--ok)}
.step .no{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.step .nm{font-size:12px;font-weight:600;margin-top:1px;line-height:1.25}
.step.cur .nm{color:var(--brand)}
.step .ct{font-size:11px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}

.task{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.task:last-child{border-bottom:0}
.task .cb{margin-top:1px;width:18px;height:18px;flex:none;border:1.5px solid var(--line2);border-radius:5px;background:var(--panel2);
  display:grid;place-items:center;cursor:pointer;padding:0;color:transparent}
.task .cb[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#06140E}
.task .cb svg{width:11px;height:11px}
.task .tt{font-weight:500;line-height:1.35}
.task.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.task .hh{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:78ch}
.task .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}

.stagehead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--line)}
.stagehead .n{font-family:var(--mono);font-size:11px;color:var(--brand)}
.stagehead h4{font-size:13px}
.stagehead .r{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .ctr b{font-family:var(--serif);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.ring .ctr span{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase}

.chart{display:flex;flex-direction:column;gap:9px}
.chartrow{display:grid;grid-template-columns:132px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12.5px}
.chartrow .lb{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chartrow .tr{height:16px;background:var(--panel3);border-radius:4px;overflow:hidden}
.chartrow .tr i{display:block;height:100%;background:var(--brand);border-radius:4px}
.chartrow .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rowsplit{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .inp{width:auto;min-width:0}
.filters .grow{flex:1 1 200px}

.schoolrow{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.schoolrow:last-child{border-bottom:0}
.schoolrow .nm{font-weight:500}
.schoolrow .loc{font-size:12.5px;color:var(--muted)}
.schoolrow .rt{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

.res-nav{display:flex;gap:6px;flex-wrap:wrap}
.res-nav button{padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer}
.res-nav button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.res-item{padding:16px 18px;border-bottom:1px solid var(--line)}
.res-item:last-child{border-bottom:0}
.res-item h4{font-size:13.5px;margin-bottom:5px}
.res-item p{color:var(--muted);max-width:72ch;font-size:13.5px}
.linklist{display:flex;flex-wrap:wrap;gap:8px;padding:16px 18px}
.linklist a{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line2);border-radius:999px;font-size:12.5px;font-weight:500}
.linklist a:hover{background:var(--brand-soft);border-color:var(--brand);text-decoration:none}

.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--serif);font-size:18px;margin-bottom:6px;color:var(--text)}
.empty p{max-width:46ch;margin:0 auto;font-size:13.5px}

.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:12.5px;line-height:1.45;border:1px solid color-mix(in srgb,var(--warn) 26%,transparent)}
.notice.info{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line)}
.notice b{font-weight:600}

/* due dates */
.dateinp{padding:3px 7px;font-size:11.5px;border:1px solid var(--line2);border-radius:5px;background:var(--panel2);color:var(--text);font-family:var(--mono)}
.dateinp:focus{outline:none;border-color:var(--brand)}

.costwrap{padding:18px;border-top:1px solid var(--line)}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* messages */
.thread{display:flex;flex-direction:column;gap:10px;padding:18px;max-height:440px;overflow:auto}
.bub{max-width:78%;padding:9px 13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.mine{align-self:flex-end;background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.bub .wh{font-size:10.5px;opacity:.72;margin-top:5px}
.composer{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px}

/* files */
.filechip{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel2)}
.filechip img{width:38px;height:38px;object-fit:cover;border-radius:5px;flex:none;background:var(--panel3)}
.filechip .fi{width:38px;height:38px;border-radius:5px;flex:none;background:var(--panel3);display:grid;place-items:center;color:var(--brand);font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.04em}
.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:18px}

/* calendar */
.calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.calhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:6px}
.calhead span{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .d{min-height:92px;border:1px solid var(--line);border-radius:7px;padding:6px;background:var(--panel);overflow:hidden}
.cal .d.out{opacity:.34}
.cal .d.now{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cal .dn{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.cal .ev{font-size:10.5px;padding:2px 5px;border-radius:4px;background:var(--brand-soft);color:var(--brand);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.cal .ev.due{background:var(--accent-soft);color:var(--accent)}
.cal .ev.late{background:var(--crit-soft);color:var(--crit)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.tplrow{display:flex;gap:10px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line)}
.tplrow:last-child{border-bottom:0}

.rep h3{font-family:var(--serif)}
.rep table.tbl td,.rep table.tbl th{padding:8px 10px}
.printonly{display:none}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-lift);width:100%;max-width:520px;max-height:86vh;overflow:auto}
.modal h3{font-family:var(--serif);font-size:19px}
.modal .mb{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--panel)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:90;
  background:var(--brand);color:var(--on-brand);padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-lift);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media print{
  :root{--bg:#fff;--panel:#fff;--panel2:#f3f3f1;--panel3:#eceae6;--line:#ccc8c0;--line2:#b9b4aa;--text:#12100C;--muted:#4a453c;--faint:#6e685d;
    --brand:#8a6d12;--brand-soft:#f6efd9;--brand-line:#d8cba0;--on-brand:#fff;--accent:#8d4d1f;--accent-soft:#f6ece4;
    --ok:#186349;--ok-soft:#e5f1ec;--warn:#7d560c;--warn-soft:#f6efdd;--crit:#8c2f25;--crit-soft:#f7e7e5;--shadow:none;--shadow-lift:none}
  .side,.topbar,.tabbar,.ticker,.no-print,#toast,#modalHost{display:none!important}
  .printonly{display:block}
  #shell.on{grid-template-columns:minmax(0,1fr)}
  .main{overflow:visible}
  .wrap{padding:0;max-width:none}
  .card,.portalhead{border:0;box-shadow:none;background:#fff;padding:0}
  .card-h{padding:0 0 10px}
  .card-b{padding:0}
  .res-item,.schoolrow,.task{break-inside:avoid}
  body{background:#fff}
}

/* mobile */
@media (max-width:860px){
  #login{grid-template-columns:1fr}
  #login .brandside{padding:32px 20px;gap:22px;border-right:0;border-bottom:1px solid var(--brand-line)}
  #login .formside{padding:28px 20px 56px}
  #shell.on{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side-h{padding:14px 16px 10px}
  .nav{flex-direction:row;overflow-x:auto;padding:8px 12px;gap:6px}
  .nav a{white-space:nowrap;padding:7px 12px;background:var(--panel2)}
  .nav a.on{background:var(--brand);color:var(--on-brand)}
  .side-f{display:none}
  .topbar{padding:10px 16px}
  .wrap{padding:16px 16px 72px;gap:16px}
  .portalhead{padding:18px 16px}
  .portalhead .ph-stats{gap:18px}
  .chartrow{grid-template-columns:104px minmax(0,1fr) 30px}
  .ring{width:78px;height:78px}
  .schoolrow{flex-wrap:wrap}
  .schoolrow .rt{margin-left:0;width:100%}
}
