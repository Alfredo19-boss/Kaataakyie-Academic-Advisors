<title>Your Application</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0A0908; --panel:#121110; --panel2:#1B1917; --panel3:#232019;
  --line:#272420; --line2:#3A352C;
  --text:#F3EEE4; --muted:#A79F90; --faint:#7B7466;
  --brand:#D9B441; --brand-2:#EBC95F; --brand-soft:#241D0E; --brand-line:#4A3C18; --on-brand:#120E04;
  --accent:#C4864A; --accent-soft:#2A1C10;
  --ok:#6FC395; --ok-soft:#10241B; --warn:#E08D3F; --warn-soft:#2B1C0C; --crit:#E0705D; --crit-soft:#2D1512;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{width:100%;max-width:880px;margin:0 auto;padding-inline:20px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:500}
.topbar{border-bottom:1px solid var(--brand-line);background:linear-gradient(90deg,#171309,#0B0A07)}
.topbar .wrap{display:flex;align-items:center;gap:11px;height:58px}
.topbar b{font-weight:600;font-size:14.5px}
.topbar span{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}

.hero{padding-block:44px 30px;border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--serif);font-size:clamp(28px,5vw,40px);line-height:1.08;margin-top:9px}
.hero .sub{color:var(--muted);margin-top:9px}
.heroflex{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:26px}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .ctr b{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ring .ctr span{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase}
.stagebox{flex:1;min-width:240px}
.stagebox h2{font-family:var(--serif);font-size:23px;margin:5px 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--panel3);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}

section{padding-block:36px;border-bottom:1px solid var(--line)}
section h3{font-family:var(--serif);font-size:21px}
section .lede{color:var(--muted);font-size:13.5px;margin-top:6px;margin-bottom:20px;max-width:64ch}

.stepper{display:flex;gap:0;overflow-x:auto;padding-bottom:4px;margin-top:26px}
.step{flex:1;min-width:104px;padding:0 4px}
.step .rail{height:4px;border-radius:999px;background:var(--panel3);margin-bottom:9px;overflow:hidden}
.step .rail i{display:block;height:100%;background:var(--brand)}
.step.done .rail i{background:var(--ok)}
.step .no{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.step .nm{font-size:12px;font-weight:600;margin-top:1px;line-height:1.25}
.step.cur .nm{color:var(--brand)}
.step .ct{font-size:11px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tick{width:18px;height:18px;flex:none;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;margin-top:2px;color:transparent}
.row .tick.on{background:var(--ok);border-color:var(--ok);color:#06140E}
.row .tick svg{width:11px;height:11px}
.row .nm{font-weight:500}
.row .loc{font-size:12.5px;color:var(--muted);margin-top:3px}
.row .rt{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:9px;border:1px solid var(--line2);
  background:var(--panel2);font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--panel3);border-color:var(--brand-line);text-decoration:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.btn.pri:hover{background:var(--brand-2);border-color:var(--brand-2)}

.notice{display:flex;gap:10px;align-items:flex-start;padding:13px 16px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;line-height:1.5;border:1px solid color-mix(in srgb,var(--warn) 26%,transparent)}
.notice.info{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line)}

.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px}
footer{padding-block:34px 56px;color:var(--faint);font-size:12.5px}
footer p{max-width:72ch;margin-bottom:8px}

@media (max-width:640px){
  .hero{padding-block:32px 24px}
  .ring{width:84px;height:84px}
  .row{flex-wrap:wrap}
  .row .rt{margin-left:0;width:100%}
}
</style>

<div class="topbar">
  <div class="wrap">
    <svg width="27" height="27" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="15" fill="#0C0A06"></rect>
      <path d="M32 13 51 32M32 13 13 32" fill="none" stroke="#D9B441" stroke-width="6" stroke-linecap="round"></path>
      <path d="M32 31 51 50M32 31 13 50" fill="none" stroke="#9A7C2E" stroke-width="6" stroke-linecap="round"></path>
    </svg>
    <b id="orgName">Katakyie Academic Advisor</b>
    <span id="asOf"></span>
  </div>
</div>

<main id="app"></main>
